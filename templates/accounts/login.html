{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In | CareerLens{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md w-full mx-auto animate-fade-in-up">
    <!-- Brand Logo/Header -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-indigo-500/10 text-indigo-500 dark:bg-indigo-400/10 dark:text-indigo-400 mb-4">
            <i data-lucide="layers" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-[var(--text-main)]">Welcome back</h1>
        <p class="mt-2 text-[var(--text-muted)]">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <div class="saas-card p-6 sm:p-8">
        <form method="post" id="loginForm" class="space-y-5">
            {% csrf_token %}
            
            <div class="space-y-1 animate-fade-in-up delay-50 opacity-0">
                <label class="block text-sm font-medium text-[var(--text-main)]">Username</label>
                <input type="text" name="username" class="saas-input w-full focus-ring-indigo" required placeholder="Enter your username">
            </div>
            
            <div class="space-y-1 animate-fade-in-up delay-100 opacity-0">
                <label class="block text-sm font-medium text-[var(--text-main)]">Password</label>
                <input type="password" name="password" class="saas-input w-full focus-ring-indigo" required placeholder="Enter your password">
            </div>
            
            <div class="pt-2 animate-fade-in-up delay-150 opacity-0">
                <button type="submit" class="saas-btn-primary w-full flex justify-center items-center py-2.5 focus-ring-indigo" id="submitBtn">
                    Sign In
                </button>
            </div>
        </form>
    </div>

    <p class="mt-6 text-center text-sm text-[var(--text-muted)] animate-fade-in-up delay-200 opacity-0">
        Don't have an account? 
        <a href="{% url 'accounts:register' %}" class="font-medium text-[var(--accent)] hover:text-[var(--accent-hover)] transition-colors focus-ring-indigo rounded">
            Register here
        </a>
    </p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    const btn = document.getElementById('submitBtn');
    if (!this.checkValidity()) return;
    
    // Add loading state visually
    const originalText = btn.innerHTML;
    btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
    lucide.createIcons();
    
    // Slight delay to let animation show before page unloads
    setTimeout(() => {
        // Just visually show a checkmark right before submit if we wanted, 
        // but simple spinner is better for SaaS.
    }, 100);
});
</script>
{% endblock %}
