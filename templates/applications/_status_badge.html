{% if status == 'saved' %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(139, 147, 166, 0.1); color: var(--muted); border: 1px solid rgba(139, 147, 166, 0.2);">
        {{ label }}
    </span>
{% elif status == 'applied' %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(140, 124, 255, 0.1); color: var(--violet); border: 1px solid rgba(140, 124, 255, 0.2);">
        {{ label }}
    </span>
{% elif status == 'assessment' %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(63, 219, 192, 0.1); color: var(--teal); border: 1px solid rgba(63, 219, 192, 0.2);">
        {{ label }}
    </span>
{% elif status == 'interview' %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(245, 178, 63, 0.1); color: var(--amber); border: 1px solid rgba(245, 178, 63, 0.2);">
        {{ label }}
    </span>
{% elif status == 'offer' %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(40, 167, 69, 0.1); color: #4ade80; border: 1px solid rgba(40, 167, 69, 0.2);">
        {{ label }}
    </span>
{% elif status == 'rejected' %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(220, 53, 69, 0.1); color: #ff6b6b; border: 1px solid rgba(220, 53, 69, 0.2);">
        {{ label }}
    </span>
{% else %}
    <span class="badge rounded-pill px-2 py-1 fw-medium" style="background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.1);">
        {{ label }}
    </span>
{% endif %}
