{% extends "base.html" %}

{% block title %}Delete Job - CareerLens{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0" style="border-radius: 12px;">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="text-danger mb-4 mx-auto bg-danger bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                        <i data-lucide="alert-triangle" style="width: 40px; height: 40px;"></i>
                    </div>
                    
                    <h3 class="fw-bold text-dark mb-3">Delete Job?</h3>
                    <p class="text-muted mb-4">
                        Are you sure you want to delete the job <strong>"{{ job.title }}" at {{ job.company }}</strong>? 
                        This action cannot be undone.
                    </p>
                    
                    <form method="post" action="{% url 'jobs:delete' job.pk %}">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <a href="{% url 'jobs:detail' job.pk %}" class="btn btn-light flex-grow-1">Cancel</a>
                            <button type="submit" class="btn btn-danger flex-grow-1">Delete Job</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
